<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Nithish — Application Developer Command Center Banner">

  <defs>
    <!-- Background radial glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#121824" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </radialGradient>

    <!-- Left card glass gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#21262d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Cyan glow filter for name -->
    <filter id="nameGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for central node -->
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Purple glow filter -->
    <filter id="purpleGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip for whole SVG -->
    <clipPath id="svgClip">
      <rect width="800" height="400" rx="12"/>
    </clipPath>

    <!-- Grid pattern -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d4ff" stroke-width="0.2" opacity="0.08"/>
    </pattern>

    <!-- Data flow dash gradient -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8a2be2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style>

    /* ── Base ── */
    .font-inter { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    .font-name { font-family: 'SignPainter-HouseScript', 'SignPainter', 'Brush Script MT', 'Georgia', cursive; font-weight: 600; }
    .font-mono { font-family: 'Share Tech Mono', 'Courier New', Courier, Monaco, monospace; }

    /* ── Radar sweep animation ── */
    @keyframes radarSweep {
      0%   { transform: rotate(0deg);   opacity: 0.8; }
      100% { transform: rotate(360deg); opacity: 0.8; }
    }

    /* ── Central node pulse ── */
    @keyframes nodePulse {
      0%   { transform: scale(1);    opacity: 1; }
      50%  { transform: scale(1.18); opacity: 0.65; }
      100% { transform: scale(1);    opacity: 1; }
    }
    .node-pulse {
      transform-origin: 565px 175px;
      animation: nodePulse 2.4s ease-in-out infinite;
    }

    /* ── Outer ring pulse ── */
    @keyframes ringPulse {
      0%   { r: 28; opacity: 0.6; }
      50%  { r: 44; opacity: 0.0; }
      100% { r: 28; opacity: 0.6; }
    }
    .ring-pulse {
      animation: ringPulse 2.4s ease-out infinite;
    }
    @keyframes ringPulse2 {
      0%   { r: 28; opacity: 0.4; }
      50%  { r: 58; opacity: 0.0; }
      100% { r: 28; opacity: 0.4; }
    }
    .ring-pulse-2 {
      animation: ringPulse2 2.4s ease-out 0.8s infinite;
    }

    /* ── Satellite node glow ── */
    @keyframes satPulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }
    .sat-a { animation: satPulse 3.1s ease-in-out 0.0s infinite; }
    .sat-b { animation: satPulse 3.1s ease-in-out 0.7s infinite; }
    .sat-c { animation: satPulse 3.1s ease-in-out 1.4s infinite; }
    .sat-d { animation: satPulse 3.1s ease-in-out 2.1s infinite; }
    .sat-e { animation: satPulse 3.1s ease-in-out 2.8s infinite; }

    /* ── Data flow on lines ── */
    @keyframes flowDash {
      0%   { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0;   }
    }
    .flow-line {
      stroke-dasharray: 6 5;
      animation: flowDash 1.8s linear infinite;
    }
    .flow-line-b { animation-delay: 0.45s; }
    .flow-line-c { animation-delay: 0.9s;  }
    .flow-line-d { animation-delay: 1.35s; }
    .flow-line-e { animation-delay: 1.8s; }

    /* Telemetry keyframes removed - static quote used in bottom bar */

    /* ── Radar sweep ── */
    .radar-sweep {
      transform-origin: 565px 175px;
      animation: radarSweep 3.5s linear infinite;
    }

    /* ── Glitch effect on name ── */
    @keyframes glitch1 {
      0%,90%,100% { clip-path: none; transform: translate(0); }
      91%          { clip-path: inset(10% 0 70% 0); transform: translate(-3px, 0); }
      93%          { clip-path: inset(60% 0 10% 0); transform: translate(3px, 0);  }
      95%          { clip-path: none; transform: translate(0); }
    }
    @keyframes glitch2 {
      0%,92%,100% { clip-path: none; transform: translate(0); opacity: 0; }
      93%          { clip-path: inset(20% 0 50% 0); transform: translate(4px, 0); opacity: 0.7; }
      95%          { clip-path: inset(50% 0 20% 0); transform: translate(-4px,0); opacity: 0.7; }
      96%          { opacity: 0; }
    }
    .name-main  { animation: glitch1 6s steps(1) infinite; }
    .name-ghost { animation: glitch2 6s steps(1) infinite; fill: #8a2be2; }

    /* ── Subtitle fade in ── */
    @keyframes subtitleFade {
      0%  { opacity: 0; transform: translateX(-10px); }
      100%{ opacity: 1; transform: translateX(0); }
    }
    .subtitle { animation: subtitleFade 1.2s ease-out 0.4s both; }

    /* ── Grid shimmer ── */
    @keyframes gridShimmer {
      0%,100% { opacity: 0.4; }
      50%     { opacity: 0.9; }
    }
    .bg-grid { animation: gridShimmer 8s ease-in-out infinite; }

    /* ── Corner bracket blink ── */
    @keyframes bracketBlink {
      0%,100% { opacity: 1; }
      50%     { opacity: 0.2; }
    }
    .corner-br { animation: bracketBlink 2s ease-in-out infinite; }

    /* ── Scan line ── */
    @keyframes scanLine {
      0%   { transform: translateY(-400px); opacity: 0.04; }
      100% { transform: translateY(400px);  opacity: 0.04; }
    }
    .scan-line { animation: scanLine 5s linear infinite; }

    /* ── Status dot blink ── */
    @keyframes statusBlink {
      0%,100% { opacity: 1; }
      50%     { opacity: 0; }
    }
    .status-dot { animation: statusBlink 1.1s ease-in-out infinite; }
  </style>

  <!-- ═══════════════════ BACKGROUND ═══════════════════ -->
  <g clip-path="url(#svgClip)">
    <rect width="800" height="400" fill="url(#bgGlow)"/>
    <!-- Grid overlay -->
    <rect class="bg-grid" width="800" height="400" fill="url(#grid)"/>

    <!-- Scan line sweep -->
    <rect class="scan-line" x="0" y="0" width="800" height="3" fill="#00f0ff"/>

    <!-- Subtle center bloom -->
    <ellipse cx="400" cy="195" rx="340" ry="200"
             fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.06"/>
    <ellipse cx="400" cy="195" rx="220" ry="130"
             fill="none" stroke="#8a2be2" stroke-width="0.5" opacity="0.08"/>

    <!-- Top edge accent line -->
    <line x1="0" y1="1" x2="800" y2="1" stroke="#00f0ff" stroke-width="1.5" opacity="0.5"/>
    <!-- Bottom edge accent line -->
    <line x1="0" y1="399" x2="800" y2="399" stroke="#8a2be2" stroke-width="1.5" opacity="0.5"/>

    <!-- Vertical divider -->
    <line x1="440" y1="20" x2="440" y2="295"
          stroke="#00f0ff" stroke-width="0.8" opacity="0.25"/>

    <!-- Corner brackets TL -->
    <g class="corner-br" opacity="0.7">
      <line x1="12" y1="12" x2="36" y2="12" stroke="#00f0ff" stroke-width="1.5"/>
      <line x1="12" y1="12" x2="12" y2="36" stroke="#00f0ff" stroke-width="1.5"/>
    </g>
    <!-- Corner brackets TR -->
    <g class="corner-br" opacity="0.7">
      <line x1="788" y1="12" x2="764" y2="12" stroke="#00f0ff" stroke-width="1.5"/>
      <line x1="788" y1="12" x2="788" y2="36" stroke="#00f0ff" stroke-width="1.5"/>
    </g>
    <!-- Corner brackets BL -->
    <g class="corner-br" opacity="0.7">
      <line x1="12" y1="388" x2="36" y2="388" stroke="#8a2be2" stroke-width="1.5"/>
      <line x1="12" y1="388" x2="12" y2="364" stroke="#8a2be2" stroke-width="1.5"/>
    </g>
    <!-- Corner brackets BR -->
    <g class="corner-br" opacity="0.7">
      <line x1="788" y1="388" x2="764" y2="388" stroke="#8a2be2" stroke-width="1.5"/>
      <line x1="788" y1="388" x2="788" y2="364" stroke="#8a2be2" stroke-width="1.5"/>
    </g>

    <!-- ═══════════════════ LEFT SIDE — PROFILE CARD ═══════════════════ -->

    <!-- Glass card background -->
    <rect x="22" y="30" width="395" height="265" rx="10"
          fill="url(#glassGrad)"
          stroke="#30363d" stroke-width="1" opacity="0.95"/>
    <!-- Card inner highlight top -->
    <rect x="23" y="31" width="393" height="1" rx="1"
          fill="#58a6ff" opacity="0.2"/>

    <!-- Card header strip -->
    <rect x="22" y="30" width="395" height="32" rx="10"
          fill="#21262d" fill-opacity="0.8"/>
    <line x1="22" y1="62" x2="417" y2="62" stroke="#30363d" stroke-width="1" opacity="0.9"/>

    <!-- Card header text -->
    <text x="42" y="50" class="font-inter"
          font-size="9" font-weight="600" letter-spacing="3"
          fill="#58a6ff" opacity="0.9">NITHISH-O7  ·  COMMAND INTERFACE  ·  v4.0</text>

    <!-- Status dot -->
    <circle class="status-dot" cx="394" cy="46" r="4" fill="#39d353"/>

    <!-- Name — glitch ghost layer -->
    <text class="name-ghost font-name"
          x="42" y="132"
          font-size="44" font-weight="600" letter-spacing="1"
          fill="#8a2be2" opacity="0">Nithish</text>

    <!-- Name — main -->
    <text class="name-main font-name"
          x="42" y="132"
          font-size="44" font-weight="600" letter-spacing="1"
          fill="#ffffff" filter="url(#nameGlow)">Nithish</text>

    <!-- Cyan underline beneath name -->
    <rect x="42" y="137" width="310" height="1.5" rx="1"
          fill="url(#lineGrad1)" opacity="0.4"/>

    <!-- Subtitle -->
    <text class="subtitle font-inter"
          x="44" y="164"
          font-size="13.5" font-weight="500" letter-spacing="0.5"
          fill="#8b949e" opacity="0.95">Application Developer  ·  Workflow  ·  Learner</text>

    <!-- Role tags -->
    <!-- Tag 1: ServiceNow -->
    <rect x="42" y="182" width="90" height="20" rx="4"
          fill="#8a2be2" fill-opacity="0.15"
          stroke="#8a2be2" stroke-width="0.8" stroke-opacity="0.5" opacity="0.95"/>
    <text x="87" y="196" class="font-inter"
          font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1"
          fill="#cc88ff">SERVICENOW</text>
 
    <!-- Tag 2: Application Developer -->
    <rect x="138" y="182" width="146" height="20" rx="4"
          fill="#ff9500" fill-opacity="0.08"
          stroke="#ff9500" stroke-width="0.8" stroke-opacity="0.5" opacity="0.95"/>
    <text x="211" y="196" class="font-inter"
          font-size="8.5" font-weight="600" text-anchor="middle" letter-spacing="0.5"
          fill="#ff9500">APPLICATION DEVELOPER</text>
 
    <!-- Tag 3: Workflow Designer -->
    <rect x="290" y="182" width="124" height="20" rx="4"
          fill="#00d4ff" fill-opacity="0.08"
          stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.5" opacity="0.95"/>
    <text x="352" y="196" class="font-inter"
          font-size="8.5" font-weight="600" text-anchor="middle" letter-spacing="0.5"
          fill="#00d4ff">WORKFLOW DESIGNER</text>


    <!-- ═══════════════════ RIGHT SIDE — IoT NETWORK ═══════════════════ -->

    <!-- Subtle right panel bg -->
    <rect x="450" y="30" width="335" height="265" rx="10"
          fill="url(#glassGrad)"
          stroke="#30363d" stroke-width="1" opacity="0.95"/>

    <!-- Panel label -->
    <text x="466" y="50" class="font-inter"
          font-size="9" font-weight="600" letter-spacing="3"
          fill="#8b949e" opacity="0.9">DEVELOPMENT ECOSYSTEM  ·  NODE MAP</text>

    <!-- ── Satellite nodes positions:
         A = top-right   (638, 82)
         B = right       (708, 175)
         C = bottom-right(638, 268)
         D = top-left    (492, 82)
    ── -->

    <!-- DATA FLOW LINES (drawn before nodes so nodes sit on top) -->

    <!-- Line: center → A (top-right) -->
    <line x1="565" y1="175" x2="638" y2="88"
          stroke="#00f0ff" stroke-width="1.2" opacity="0.25"/>
    <line class="flow-line" x1="565" y1="175" x2="638" y2="88"
          stroke="#00f0ff" stroke-width="1.8" opacity="0.7"/>

    <!-- Line: center → B (right) -->
    <line x1="565" y1="175" x2="700" y2="175"
          stroke="#00f0ff" stroke-width="1.2" opacity="0.25"/>
    <line class="flow-line flow-line-b" x1="565" y1="175" x2="700" y2="175"
          stroke="#8a2be2" stroke-width="1.8" opacity="0.7"/>

    <!-- Line: center → C (bottom-right) -->
    <line x1="565" y1="175" x2="638" y2="262"
          stroke="#00f0ff" stroke-width="1.2" opacity="0.25"/>
    <line class="flow-line flow-line-c" x1="565" y1="175" x2="638" y2="262"
          stroke="#00f0ff" stroke-width="1.8" opacity="0.7"/>

    <!-- Line: center → D (top-left) -->
    <line x1="565" y1="175" x2="492" y2="88"
          stroke="#8a2be2" stroke-width="1.2" opacity="0.25"/>
    <line class="flow-line flow-line-d" x1="565" y1="175" x2="492" y2="88"
          stroke="#8a2be2" stroke-width="1.8" opacity="0.7"/>
 
    <!-- Line: center → E (bottom-left) -->
    <line x1="565" y1="175" x2="492" y2="262"
          stroke="#00f0ff" stroke-width="1.2" opacity="0.25"/>
    <line class="flow-line flow-line-e" x1="565" y1="175" x2="492" y2="262"
          stroke="#00f0ff" stroke-width="1.8" opacity="0.7"/>

    <!-- ── CENTRAL NODE ── -->

    <!-- Outer pulsing rings -->
    <circle class="ring-pulse" cx="565" cy="175" r="28"
            fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
    <circle class="ring-pulse-2" cx="565" cy="175" r="28"
            fill="none" stroke="#8a2be2" stroke-width="1" opacity="0.4"/>

    <!-- Radar sweep -->
    <g class="radar-sweep">
      <path d="M565,175 L565,135 A40,40 0 0,1 597,147 Z"
            fill="#00f0ff" fill-opacity="0.08"/>
      <line x1="565" y1="175" x2="565" y2="133"
            stroke="#00f0ff" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- Central node body (pulsing) -->
    <g class="node-pulse" filter="url(#nodeGlow)">
      <!-- Core glow ring -->
      <circle cx="565" cy="175" r="22"
              fill="#00f0ff" fill-opacity="0.08"
              stroke="#00f0ff" stroke-width="1.5" opacity="0.9"/>
      <!-- Inner fill -->
      <circle cx="565" cy="175" r="14"
              fill="#0a1528" stroke="#00f0ff" stroke-width="2"/>
      <!-- Cross-hairs -->
      <line x1="557" y1="175" x2="573" y2="175" stroke="#00f0ff" stroke-width="1" opacity="0.9"/>
      <line x1="565" y1="167" x2="565" y2="183" stroke="#00f0ff" stroke-width="1" opacity="0.9"/>
      <!-- Center dot -->
      <circle cx="565" cy="175" r="3" fill="#00f0ff"/>
    </g>

    <!-- Central label -->
    <text x="565" y="205" class="font-inter"
          font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1.5"
          fill="#00f0ff" opacity="0.6">CORE</text>

    <!-- ── SATELLITE NODE A — top-right ── -->
    <g class="sat-a" filter="url(#purpleGlow)">
      <circle cx="638" cy="88" r="11"
              fill="#0a1528" stroke="#8a2be2" stroke-width="1.5"/>
      <circle cx="638" cy="88" r="5" fill="#8a2be2" opacity="0.8"/>
    </g>
    <text x="638" y="72" class="font-inter"
          font-size="7.5" font-weight="600" text-anchor="middle" letter-spacing="1"
          fill="#8a2be2" opacity="0.8">JAVA</text>

    <!-- ── SATELLITE NODE B — right ── -->
    <g class="sat-b" filter="url(#purpleGlow)">
      <circle cx="706" cy="175" r="11"
              fill="#0a1528" stroke="#00f0ff" stroke-width="1.5"/>
      <circle cx="706" cy="175" r="5" fill="#00f0ff" opacity="0.8"/>
    </g>
    <text x="726" y="179" class="font-inter"
          font-size="7.5" font-weight="600" text-anchor="start" letter-spacing="1"
          fill="#00f0ff" opacity="0.8">API</text>

    <!-- ── SATELLITE NODE C — bottom-right ── -->
    <g class="sat-c" filter="url(#purpleGlow)">
      <circle cx="638" cy="262" r="11"
              fill="#0a1528" stroke="#8a2be2" stroke-width="1.5"/>
      <circle cx="638" cy="262" r="5" fill="#8a2be2" opacity="0.8"/>
    </g>
    <text x="638" y="283" class="font-inter"
          font-size="7.5" font-weight="600" text-anchor="middle" letter-spacing="1"
          fill="#8a2be2" opacity="0.8">CLOUD</text>

    <!-- ── SATELLITE NODE D — top-left ── -->
    <g class="sat-d" filter="url(#purpleGlow)">
      <circle cx="492" cy="88" r="11"
              fill="#0a1528" stroke="#00f0ff" stroke-width="1.5"/>
      <circle cx="492" cy="88" r="5" fill="#00f0ff" opacity="0.8"/>
    </g>
    <text x="492" y="72" class="font-inter"
          font-size="7.5" font-weight="600" text-anchor="middle" letter-spacing="1"
          fill="#00f0ff" opacity="0.8">SNOW</text>
 
    <!-- ── SATELLITE NODE E — bottom-left ── -->
    <g class="sat-e" filter="url(#purpleGlow)">
      <circle cx="492" cy="262" r="11"
              fill="#0a1528" stroke="#8a2be2" stroke-width="1.5"/>
      <circle cx="492" cy="262" r="5" fill="#8a2be2" opacity="0.8"/>
    </g>
    <text x="492" y="283" class="font-inter"
          font-size="7.5" font-weight="600" text-anchor="middle" letter-spacing="1"
          fill="#8a2be2" opacity="0.8">JAVASCRIPT</text>

    <!-- ═══════════════════ BOTTOM — TELEMETRY FEED ═══════════════════ -->

    <!-- Quote inside bottom glass card -->
    <rect x="22" y="308" width="763" height="56" rx="10"
          fill="url(#glassGrad)"
          stroke="#30363d" stroke-width="1" opacity="0.95"/>
    <rect x="23" y="309" width="761" height="1" rx="1"
          fill="#58a6ff" opacity="0.2"/>
 
    <g transform="translate(400, 342)">
      <text class="font-mono" x="0" y="0"
            font-size="12" font-weight="600" letter-spacing="1"
            fill="#8b949e" text-anchor="middle">
        "If at first you don't succeed, try, try again."
      </text>
    </g>

    <!-- Bottom right timestamp -->
    <text x="776" y="390" class="font-inter"
          font-size="8" font-weight="400" text-anchor="end" letter-spacing="1"
          fill="#8b949e" opacity="0.8">NITHISH-O7  ·  IST +05:30  ·  2026</text>

  </g>
</svg>
